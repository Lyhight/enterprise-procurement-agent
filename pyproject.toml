[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-procurement-agent"
version = "0.1.0"
description = "Enterprise Procurement Intelligence Agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
llm = ["openai>=1.0,<3.0"]

[project.scripts]
procurement-agent = "procurement_agent.interfaces.cli:main"
procurement-agent-eval = "procurement_agent.evaluation.runner:main"
procurement-integration-worker = "procurement_agent.interfaces.integration_worker:main"
procurement-rfq-worker = "procurement_agent.interfaces.rfq_delivery_worker:main"
procurement-agent-maintenance = "procurement_agent.interfaces.maintenance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
procurement_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

